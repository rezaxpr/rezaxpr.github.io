<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova Messenger</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #080b14;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    text-align: center;
}

.logo {
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 10px;
}

.subtitle {
    color: #9ca3af;
    margin-bottom: 30px;
}

button {
    border: 0;
    padding: 13px 28px;
    margin: 8px;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    background: #5865f2;
    color: white;
}

button:hover {
    opacity: .85;
}

.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    align-items: center;
    justify-content: center;
}

.modal.show {
    display: flex;
}

.box {
    width: 360px;
    max-width: 90%;
    background: #111827;
    padding: 30px;
    border-radius: 20px;
}

.box h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0;
    border: 1px solid #374151;
    border-radius: 10px;
    background: #1f2937;
    color: white;
}

.close {
    background: #374151;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">✦ Nova</div>

    <div class="subtitle">
        Fast. Private. Simple.
    </div>

    <button onclick="openLogin()">
        Login
    </button>

    <button onclick="openRegister()">
        Register
    </button>

</div>


<!-- LOGIN -->

<div id="loginModal" class="modal">

    <div class="box">

        <h2>Login</h2>

        <input
            id="loginPhone"
            type="tel"
            placeholder="Phone number"
        >

        <button onclick="login()">
            Continue
        </button>

        <button class="close" onclick="closeLogin()">
            Close
        </button>

    </div>

</div>


<!-- REGISTER -->

<div id="registerModal" class="modal">

    <div class="box">

        <h2>Register</h2>

        <input
            id="registerPhone"
            type="tel"
            placeholder="Phone number"
        >

        <button onclick="register()">
            Create account
        </button>

        <button class="close" onclick="closeRegister()">
            Close
        </button>

    </div>

</div>


<script>

function openLogin() {
    document
        .getElementById("loginModal")
        .classList.add("show");
}

function closeLogin() {
    document
        .getElementById("loginModal")
        .classList.remove("show");
}

function openRegister() {
    document
        .getElementById("registerModal")
        .classList.add("show");
}

function closeRegister() {
    document
        .getElementById("registerModal")
        .classList.remove("show");
}

function login() {

    const phone =
        document.getElementById("loginPhone").value.trim();

    if (!phone) {
        alert("Please enter your phone number.");
        return;
    }

    alert("Login button works! Backend will be connected next.");
}

function register() {

    const phone =
        document.getElementById("registerPhone").value.trim();

    if (!phone) {
        alert("Please enter your phone number.");
        return;
    }

    alert("Register button works! Backend will be connected next.");
}

</script>

</body>
</html>
